<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e2638"/>
      <stop offset="100%" stop-color="#090c12"/>
    </radialGradient>
    <linearGradient id="bar1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#008bba"/><stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/><stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7e22ce"/><stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="bar4" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/><stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="bar5" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle App Background -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" stroke="#00f2fe" stroke-width="4" stroke-opacity="0.35"/>

  <!-- Brand Subtle Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#222a3a" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Equalizer Audio Bars -->
  <g filter="url(#glow)">
    <!-- Bar 1 -->
    <rect x="136" y="230" width="36" height="120" rx="18" fill="url(#bar1)"/>
    <!-- Bar 2 -->
    <rect x="192" y="160" width="36" height="190" rx="18" fill="url(#bar2)"/>
    <!-- Bar 3 -->
    <rect x="248" y="110" width="36" height="240" rx="18" fill="url(#bar3)"/>
    <!-- Bar 4 -->
    <rect x="304" y="180" width="36" height="170" rx="18" fill="url(#bar4)"/>
    <!-- Bar 5 -->
    <rect x="360" y="220" width="36" height="130" rx="18" fill="url(#bar5)"/>
  </g>

  <!-- Nix Bui Brand text at bottom -->
  <text x="256" y="415" text-anchor="middle" font-family="'JetBrains Mono', 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="28" fill="#f1f5f9" letter-spacing="4">NIX BÙI</text>
  <text x="256" y="445" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" font-size="14" fill="#00f2fe" letter-spacing="2">EVENT AUDIO</text>
</svg>
